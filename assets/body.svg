<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160"><style>
@keyframes blink { 50% { opacity: 0 } }
@keyframes flicker { 0%,100% { opacity: .9 } 47% { opacity: .55 } 50% { opacity: 1 } 53% { opacity: .68 } }
@keyframes pulse { 0%,100% { opacity: .82 } 50% { opacity: 1 } }
.cursor { animation: blink 1.1s step-end infinite }
.mote { animation: flicker 4.2s ease-in-out infinite }
.glowpulse { animation: pulse 5.5s ease-in-out infinite }
</style><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c1c24" stroke-width="1"/>
</pattern>
<pattern id="bark" width="56" height="40" patternUnits="userSpaceOnUse">
  <path d="M 0 20 H 56" stroke="#7a6234" stroke-width="1" stroke-opacity="0.22"/>
  <path d="M 19 0 V 40" stroke="#7a6234" stroke-width="1" stroke-opacity="0.12"/>
  <path d="M 40 0 V 40" stroke="#7a6234" stroke-width="1" stroke-opacity="0.12"/>
</pattern>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="3"/>
</filter>
<linearGradient id="railL" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#0a0a0c"/>
  <stop offset="0.55" stop-color="#2e2619"/>
  <stop offset="1" stop-color="#7a6234"/>
</linearGradient>
<linearGradient id="railR" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#7a6234"/>
  <stop offset="0.45" stop-color="#2e2619"/>
  <stop offset="1" stop-color="#0a0a0c"/>
</linearGradient>
<linearGradient id="treeGrad" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0" stop-color="#7a6234"/>
  <stop offset="1" stop-color="#f2d06b"/>
</linearGradient>
<radialGradient id="halo">
  <stop offset="0" stop-color="#f2d06b" stop-opacity="0.20"/>
  <stop offset="1" stop-color="#f2d06b" stop-opacity="0"/>
</radialGradient>
<radialGradient id="mote">
  <stop offset="0" stop-color="#f2d06b"/>
  <stop offset="0.5" stop-color="#f2d06b" stop-opacity="0.5"/>
  <stop offset="1" stop-color="#f2d06b" stop-opacity="0"/>
</radialGradient>
<linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0a0a0c" stop-opacity="0.92"/>
  <stop offset="1" stop-color="#0a0a0c" stop-opacity="0"/>
</linearGradient>
<linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0a0a0c" stop-opacity="0"/>
  <stop offset="1" stop-color="#0a0a0c" stop-opacity="1"/>
</linearGradient>
</defs><rect width="1200" height="160" fill="#0a0a0c"/><rect width="1200" height="160" fill="url(#grid)" opacity="0.55"/><ellipse cx="600" cy="80" rx="432" ry="96" fill="url(#halo)" opacity="0.5"/><path d="M 96 112 Q 600 64 1104 120" fill="none" stroke="#3a3a45" stroke-width="2" opacity="0.5"/><path d="M 96 152 Q 600 104 1104 160" fill="none" stroke="#3a3a45" stroke-width="1.4" opacity="0.35"/><rect x="0" y="0" width="56" height="160" fill="url(#railL)"/><rect x="1144" y="0" width="56" height="160" fill="url(#railR)"/><rect x="0" y="0" width="56" height="160" fill="url(#bark)"/><rect x="1144" y="0" width="56" height="160" fill="url(#bark)"/><rect x="48" y="0" width="10" height="160" fill="#f2d06b" opacity="0.16" filter="url(#soft)"/><rect x="1142" y="0" width="10" height="160" fill="#f2d06b" opacity="0.16" filter="url(#soft)"/><line x1="56" y1="0" x2="56" y2="160" stroke="#c8a15a" stroke-width="1.4" opacity="0.8"/><line x1="1144" y1="0" x2="1144" y2="160" stroke="#c8a15a" stroke-width="1.4" opacity="0.8"/><circle class="mote" cx="56" cy="0" r="7" fill="url(#mote)"/><circle class="mote" cx="1144" cy="0" r="7" fill="url(#mote)"/><circle class="mote" cx="56" cy="80" r="7" fill="url(#mote)"/><circle class="mote" cx="1144" cy="80" r="7" fill="url(#mote)"/><circle class="mote" cx="56" cy="160" r="7" fill="url(#mote)"/><circle class="mote" cx="1144" cy="160" r="7" fill="url(#mote)"/></svg>