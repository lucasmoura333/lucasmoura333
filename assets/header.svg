<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><style>@font-face{font-family:'Cinzel';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
@keyframes blink { 50% { opacity: 0 } }
@keyframes flicker { 0%,100% { opacity: .9 } 47% { opacity: .55 } 50% { opacity: 1 } 53% { opacity: .68 } }
@keyframes pulse { 0%,100% { opacity: .82 } 50% { opacity: 1 } }
.cursor { animation: blink 1.1s step-end infinite }
.mote { animation: flicker 4.2s ease-in-out infinite }
.glowpulse { animation: pulse 5.5s ease-in-out infinite }
</style><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
